<app-logged-header></app-logged-header>

<div class="flex flex-col md:flex-row p-4 gap-6 bg-[#1E1E1E]">
  <!-- Main Content -->
  <div class="flex-1 text-white" *ngIf="mainVideo !== undefined">
    <!-- Video Player -->
    <div class="aspect-video bg-black rounded-lg overflow-hidden">
      <video #videoPlayer controls src="{{mainVideo.streamUrl}}" class="w-full h-full"></video>
    </div>


    <!-- Video Title -->
    <h1 class="mt-4 text-xl font-bold text-white">{{ mainVideo.title }}</h1>

    <!-- Channel Info + Follow/Subscribe -->
    <div class="flex justify-between items-center mt-3 text-sm text-white">

    <div class="flex items-center gap-3">
        <!-- Avatar -->
        <a [routerLink]="'/profile/' + mainVideo.author" >
            <img
        [src]="'/shared/default_user.svg'"
        alt="{{ mainVideo.author }}"
        class="w-10 h-10 rounded-full object-cover" />
        </a>

        <!-- Channel Name & View Info -->
        <div class="flex flex-col">
        <a [routerLink]="'/profile/' + mainVideo.author" class="font-semibold text-white hover:underline">
            {{ mainVideo.author }}
        </a>
        <span class="text-xs text-white">{{mainVideo.viewerCount || 0}} visualizaciones · {{mainVideo.createdAt}}</span>
        </div>
    </div>

    <!-- Follow & Subscribe Buttons -->
    <div class="flex gap-x-3" [class.invisible]="actualUsername === mainVideo.author">
        <button mat-stroked-button (click)="onFollowClick(followBtn)"
                class="bg-white rounded-full font-black hover:bg-gray-200 px-4 h-[35px] text-sm"
                #followBtn>
        <i class="far fa-bell fa-lg mr-2"></i>
        {{ followBtnMsg || "Seguir" }}
        </button>

        <button mat-stroked-button (click)="onSuscribeClick(suscribeBtn)"
                class="bg-white rounded-full text-sm hover:bg-gray-200 px-4 h-[35px]"
                #suscribeBtn>
        {{ suscribeBtnMsg || "Unirme" }}
        </button>
    </div>
    </div>

    <!-- Video Description -->
    <div class="mt-4 text-sm text-white whitespace-pre-wrap">
    {{ mainVideo.desc}}
    </div>

    <!-- Comments -->
    <div class="mt-6 flex flex-col gap-y-4">
      <h3 class="text-lg font-semibold mb-2">Comments</h3>
      <!-- <mat-form-field hideRequiredMarker="true" (keydown.enter)="handleComment()" class="w-2/7">
           <mat-label> Comentario </mat-label>
           <input matInput required [formControl]="inputComment"/>
           <mat-error *LoginngIf=""></mat-error>
           </mat-form-field> -->
      <input (keydown.enter)="createComment($event)" type=text placeholder="Añade un comentario"
             class="hover:outline-0 active:outline-0 focus:outline-0 border-b-1 border-gray-500 placeholder:text-gray-400">

        <div *ngFor="let comment of comments()" class="flex gap-3 mb-6">
        <!-- Avatar/Icon placeholder -->
        <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold text-sm">
            <img
            [src]="'/shared/default_user.svg'"
            alt="{{ mainVideo.author }}"
            class="w-10 h-10 rounded-full object-cover" />
        </div>

        <!-- Comment Content -->
        <div class="flex flex-col text-white">
        <div class="flex items-center gap-x-2">
            <span class="text-sm font-semibold">{{ comment.author }}</span>

            <!-- Actions (only show if author is current user) -->
            <div *ngIf="comment.author === actualUsername" class="flex items-center gap-x-2 text-sm text-gray-400">
                <i
                    class="fa fa-pen cursor-pointer hover:text-yellow-400 transition"
                    title="Editar"
                    (click)="startEditingComment(comment)">
                </i>
                <i
                    class="fa fa-xmark cursor-pointer hover:text-red-500 transition"
                    title="Eliminar"
                    (click)="deleteComment($event, comment)">
                </i>
            </div>

        </div>

        <p *ngIf="editingComment?.commentId != comment.commentId"
           class="text-sm text-gray-300 mt-1">{{ comment.comment }}</p>

        <input #editInput *ngIf="editingComment?.commentId == comment.commentId"
            type="text"
            class="mt-1 p-1 text-sm text-black rounded bg-white"
            (blur)="updateEditedComment(editInput.value)" />

        </div>
      <!-- TODO: terminar esto, no va el color por cierto -->
    </div>
     <ng-template class="text-black" ngIf="comments().length === 0"> No hay comentarios. </ng-template>
  </div>

  </div>
  <!-- Sidebar -->
  <div class="w-full md:w-80">
    <h3 class="text-md font-semibold mb-2">Up Next</h3>
    <div *ngFor="let video of videos()" class="mb-4">
      <app-video
        [videoLink]="'/video/' + video.streamId"
        [videoImgUrl]="video.thumbnailUrl || '/shared/empty_thumbnail.png'"
        [videoTitle]="video.title"
        [profileLink]="'/profile/' + video.author"
        [profileImgUrl]="'/shared/default_user.svg'"
        [streamer]="video.author"
        [viewers]="video.viewerCount || 0"
        [createdAt]="this.fechaService.getTimeAgo(video.createdAt)"
      ></app-video>
    </div>
  </div>
</div>
